# CI for Vapi Orca. Typecheck, tests and `orca plugin validate` need the Orca app, so they run
# locally with `npm run check`; CI runs the checks that need nothing but Node and git.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Static security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit source against SECURITY.md
        run: node scripts/audit.mjs
      - name: Manifest is valid JSON with the expected identity
        run: |
          node -e "
            const m = require('./orca-plugin.json');
            if (m.id !== 'vapi' || m.manifestVersion !== 2) { console.error('unexpected manifest identity'); process.exit(1) }
            console.log('manifest ok:', m.name, m.version)
          "

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
