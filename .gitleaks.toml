# Gitleaks config: the default rules, plus an allowlist for the deliberately fake secrets the
# tests use to prove redaction works. Only these exact values are allowed; any other secret,
# in tests or anywhere else, still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "Fake secrets used by the test suite"
regexes = [
  '''FAKE[A-Za-z0-9_.-]*''',
  '''test-key-0123456789abcdef-SECRET''',
  '''abcdef0123456789-secret''',
  '''3f1c2a4b-5d6e-4f70-8a9b-0c1d2e3f4a5b''',
]
